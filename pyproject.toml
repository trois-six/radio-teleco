[project]
name = "radio-teleco"
version = "0.1.0"
description = "Reverse engineering of the 868 MHz radio link of Teleco Automation boxes: frame model, rolling code, box radio tables and SDR decoding"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "trois-six" }]
requires-python = ">=3.12"
dependencies = ["aioteleco>=0.2"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Communications :: Ham Radio",
  "Topic :: Home Automation",
  "Typing :: Typed",
]

[project.optional-dependencies]
cli = ["aioteleco[cli]>=0.2"]
sdr = ["numpy>=2.0"]

[project.scripts]
radio-teleco = "radio_teleco.cli:main"

[project.urls]
Homepage = "https://github.com/trois-six/radio-teleco"
Issues = "https://github.com/trois-six/radio-teleco/issues"

[dependency-groups]
dev = [
  "mypy>=1.15",
  "numpy>=2.0",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-cov>=7.1",
  "ruff>=0.11",
  "typer>=0.15",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
# module-root "src" and module-name "radio_teleco" are the defaults.
source-include = ["tests/**"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["live: talks to the real Teleco cloud / box (deselected by default)"]
# --cov: every plain `uv run pytest` (CI included) reports coverage and enforces
# [tool.coverage.report] fail_under; pass --no-cov to skip it (e.g. running one test).
addopts = "-m 'not live' --strict-markers --strict-config --cov"
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["radio_teleco"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 75
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC", "PT", "TRY", "N", "NPY"]
ignore = ["TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802"]
